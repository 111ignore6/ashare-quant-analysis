name: CI

# 为什么要有这个文件：README 与 CONTRIBUTING 都写着
# "`pytest` 与 `ruff check .` 均须全绿再提交"，但在 2026-09-18 之前
# **没有任何东西强制执行它**。按本项目自己的判据纪律
# （"自述指标必须与实测对撞，不能自证"），一条没人跑的验收等于没有验收。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只装测试真正需要的子集：
      #   - akshare / baostock / mootdx **不必装**：三个 fetcher 都把
      #     `import akshare` 之类放在**函数体内**懒加载，模块级导入不需要它们
      #     （实测：import ashare_quant.fetchers 后 sys.modules 里没有这三者）。
      #   - streamlit **必须装**：tests/test_dashboard_smoke.py 会 exec dashboard.py，
      #     而 dashboard.py 顶层就 import streamlit。
      #     ⚠️ 2026-09-23 第一次跑 CI 时正是漏了它 → 5 个测试 ModuleNotFoundError。
      #     这条清单要跟着"测试实际 import 了什么"走，不能凭印象写。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy statsmodels scikit-learn
          python -m pip install lightgbm xgboost pyarrow PyYAML requests joblib
          python -m pip install plotly tqdm
          python -m pip install streamlit streamlit-autorefresh
          python -m pip install pytest

      # ⚠️ ruff 必须钉版本，且要与 pyproject.toml 的 [tool.ruff] 一起看。
      # 2026-09-23 事故：本仓库当时没有任何 ruff 配置，`ruff check .` 用默认规则集，
      # 而 ruff 0.16 扩大了默认集 —— 同一个 commit 本地绿、CI 红 179 项。
      # 现在规则集在 pyproject.toml 里显式声明（经典默认 E4/E7/E9/F），这里钉同一小版本。
      # 升级 ruff 时请把这一行与 pyproject 的 dev extra 一起改，并重跑全量检查。
      - name: Install ruff (pinned)
        run: python -m pip install "ruff>=0.16,<0.17"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest)
        run: python -m pytest tests/ -q

      # 项数必须与 README/AGENTS.md 里写的对得上 ——
      # 这两处曾经自相矛盾（一个说 212、同段的演进列表却止于 203）。
      - name: Report test count
        run: python -m pytest tests/ --collect-only -q

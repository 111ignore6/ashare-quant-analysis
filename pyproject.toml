[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
dynamic = ["version"]
description = "A股全市场量化研究·模拟分析系统（模拟研究，不构成投资建议）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ashare-quant" }]
keywords = ["quant", "ashare", "finance", "research", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "akshare>=1.12",
    "baostock>=0.8.8",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "plotly>=5.18",
    "lightgbm>=4.0",
    "mootdx>=0.11",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "streamlit-autorefresh>=1.0", "easyquotation>=0.7"]
dl = ["torch>=2.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.6", "ruff>=0.4"]

[project.scripts]
ashare-quant = "ashare_quant.cli:main"

[tool.setuptools]
packages = { find = { include = ["ashare_quant*"] } }

[tool.setuptools.dynamic]
version = { attr = "ashare_quant.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

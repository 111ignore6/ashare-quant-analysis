[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
dynamic = ["version"]
description = "A股全市场量化研究·模拟分析系统（模拟研究，不构成投资建议）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "111ignore6" }]
keywords = ["quant", "ashare", "finance", "research", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
# ⚠️ 这份清单必须覆盖「模块级 import」的全部第三方包，否则全新环境装完即崩：
#   tqdm    —— ashare_quant/daily.py 顶层 import
#   xgboost —— 默认模型池（config.yaml 的 models 含 xgb）会用到
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "akshare>=1.12",
    "baostock>=0.8.8",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "requests>=2.31",
    "joblib>=1.3",
    "plotly>=5.18",
    "tqdm>=4.66",
    "mootdx>=0.11",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "streamlit-autorefresh>=1.0"]
dl = ["torch>=2.0"]
# ruff 钉小版本：0.16 改过默认规则集，不钉的话 CI 的"绿"会随上游发布漂移
dev = ["pytest>=8.0", "pyinstaller>=6.6", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/111ignore6/ashare-quant-analysis"
Repository = "https://github.com/111ignore6/ashare-quant-analysis"
Issues = "https://github.com/111ignore6/ashare-quant-analysis/issues"

[project.scripts]
ashare-quant = "ashare_quant.cli:main"

[tool.setuptools]
packages = { find = { include = ["ashare_quant*"] } }

[tool.setuptools.dynamic]
version = { attr = "ashare_quant.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ============================================================ 静态检查
#
# ⚠️ 为什么必须显式写 select（2026-09-23 事故）：
# 本项目此前**没有任何 ruff 配置**，`ruff check .` 一直在用 ruff 的**默认规则集**。
# ruff 0.16 扩大了默认集，于是同一个 commit、同一份代码：
#     本地（ruff 0.15.13）→ All checks passed!
#     CI  （ruff 0.16.8）→ Found 179 errors.
# 也就是说"全绿"这件事**取决于你装的是哪个 ruff**，而 CI 会自己装最新版。
# 这与本项目自己的判据纪律（"自述指标必须与实测对撞"）是同一类问题：
# **一条标准如果没被写下来，它的含义就会静默漂移。**
#
# 这里刻意**只声明经典默认集**（E4/E7/E9/F），不扩大检查范围：
# 扩大规则集会牵动几十个文件的机械改动，对一个研究项目收益不划算。
# 将来若要收紧，请单独开一次改动并逐条 review，不要顺手加。
# 同时 ruff 钉在 `>=0.16,<0.17`（dev extra / requirements.txt / CI 三处一致）。
[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# E4/E7/E9 = pycodestyle 错误（import 位置、语句错误、语法级问题）
# F         = pyflakes（未定义名、未使用导入等真 bug 类）
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

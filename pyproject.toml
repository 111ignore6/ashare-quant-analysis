[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
dynamic = ["version"]
description = "A股全市场量化研究·模拟分析系统（模拟研究，不构成投资建议）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "111ignore6" }]
keywords = ["quant", "ashare", "finance", "research", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
# ⚠️ 这份清单必须覆盖「模块级 import」的全部第三方包，否则全新环境装完即崩：
#   tqdm    —— ashare_quant/daily.py 顶层 import
#   xgboost —— 默认模型池（config.yaml 的 models 含 xgb）会用到
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "akshare>=1.12",
    "baostock>=0.8.8",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "requests>=2.31",
    "joblib>=1.3",
    "plotly>=5.18",
    "tqdm>=4.66",
    "mootdx>=0.11",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "streamlit-autorefresh>=1.0"]
dl = ["torch>=2.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.6", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/111ignore6/ashare-quant-analysis"
Repository = "https://github.com/111ignore6/ashare-quant-analysis"
Issues = "https://github.com/111ignore6/ashare-quant-analysis/issues"

[project.scripts]
ashare-quant = "ashare_quant.cli:main"

[tool.setuptools]
packages = { find = { include = ["ashare_quant*"] } }

[tool.setuptools.dynamic]
version = { attr = "ashare_quant.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

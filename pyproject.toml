[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
dynamic = ["version"]
description = "A股全市场量化研究·模拟分析系统（模拟研究，不构成投资建议）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "111ignore6" }]
keywords = ["quant", "ashare", "finance", "research", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
# ⚠️ 这份清单必须覆盖「模块级 import」的全部第三方包，否则全新环境装完即崩：
#   tqdm    —— ashare_quant/daily.py 顶层 import
#   xgboost —— 默认模型池（config.yaml 的 models 含 xgb）会用到
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "akshare>=1.12",
    "baostock>=0.8.8",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "requests>=2.31",
    "joblib>=1.3",
    "plotly>=5.18",
    "tqdm>=4.66",
    "mootdx>=0.11",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "streamlit-autorefresh>=1.0"]
dl = ["torch>=2.0"]
# ruff 钉小版本：0.16 改过默认规则集，不钉的话 CI 的"绿"会随上游发布漂移
dev = ["pytest>=8.0", "pyinstaller>=6.6", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/111ignore6/ashare-quant-analysis"
Repository = "https://github.com/111ignore6/ashare-quant-analysis"
Issues = "https://github.com/111ignore6/ashare-quant-analysis/issues"

[project.scripts]
ashare-quant = "ashare_quant.cli:main"

[tool.setuptools]
packages = { find = { include = ["ashare_quant*"] } }

[tool.setuptools.dynamic]
version = { attr = "ashare_quant.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ============================================================ 静态检查
#
# ⚠️ 为什么必须显式写 select（2026-09-23 事故）：
# 本项目此前**没有任何 ruff 配置**，`ruff check .` 一直在用 ruff 的**默认规则集**。
# ruff 0.16 扩大了默认集，于是同一个 commit、同一份代码：
#     本地（ruff 0.15.13）→ All checks passed!
#     CI  （ruff 0.16.8）→ Found 179 errors.
# 也就是说"全绿"这件事**取决于你装的是哪个 ruff**，而 CI 会自己装最新版。
# 这与本项目自己的判据纪律（"自述指标必须与实测对撞"）是同一类问题：
# **一条标准如果没被写下来，它的含义就会静默漂移。**
# 现在规则集显式声明，并把 ruff 钉在 dev 依赖的 `>=0.16,<0.17`。
#
# 选这套规则的理由：
#   E4/E7/E9  pycodestyle 错误（import 位置、语句错误、语法级问题）
#   F         pyflakes —— 未定义名、未使用导入等**真 bug 类**
#   I         import 排序（机械、可自动修，统一风格）
#   UP        pyupgrade —— 用现代语法
#   B         flake8-bugbear —— 可疑构造（闭包捕获循环变量等）
#   BLE       flake8-blind-except —— **代码里本来就有 26 处 `noqa: BLE001`**，
#             说明作者一直是按"要检查盲 except"写的；不选它那些 noqa 反而成了死注释
#   RUF100    未使用的 noqa —— 防止 noqa 变成噪音（正是它暴露了上面那件事）
#
# 刻意**不选**的：
#   E501  行长由人判断，机器强制只会逼出难读的断行
#   B905  zip(strict=) —— 会改变运行期行为（长度不等时由静默截断变抛错），
#         不是纯风格问题，需逐个判断，不适合一刀切启用
#   N/ARG pep8-naming 与未使用参数 —— 实测 365 项噪音（ML 代码里 X/y/X_ 是惯例），
#         收益远小于代价
[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "RUF100"]
ignore = ["E501", "B905"]
